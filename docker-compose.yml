services:
  mock-api:
    build:
      context: ./tests/mock-api
    container_name: stock-a-mock-api
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5001
    container_name: stock-a-mock-web
    ports:
      - "3000:80"
    depends_on:
      - mock-api
    restart: unless-stopped

  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64
    container_name: oracle-xe
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: SqlPlusDB
    volumes:
      - oracle-xe-data:/opt/oracle/oradata
    restart: unless-stopped
    profiles:
      - oracle

  backend:
    build:
      context: ./Backend
    container_name: stock-a-mock-backend
    ports:
      - "5002:5001"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DB_CONNECTION_STRING: oracle-xe:1521/XEPDB1
    depends_on:
      - oracle-xe
    profiles:
      - oracle

volumes:
  oracle-xe-data:
    external: true

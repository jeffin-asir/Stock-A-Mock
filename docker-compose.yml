services:
  mock-api:
    build:
      context: ./tests/mock-api
    container_name: stock-a-mock-api
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5001
    container_name: stock-a-mock-web
    ports:
      - "8080:80"
    depends_on:
      - mock-api
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
    container_name: stock-a-mock-backend
    ports:
      - "5002:5001"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    profiles:
      - oracle

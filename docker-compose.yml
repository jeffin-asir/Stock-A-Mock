services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5001
    ports:
      - "3000:80"
    restart: unless-stopped

  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64
    container_name: oracle-xe
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: SqlPlusDB
    volumes:
      - oracle-xe-data:/opt/oracle/oradata
    restart: unless-stopped
    profiles:
      - oracle

  backend:
    build:
      context: ./Backend
    ports:
      - "5001:5001"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DB_CONNECTION_STRING: host.docker.internal:1521/XEPDB1
      DB_LibDir: ""
    restart: unless-stopped

volumes:
  oracle-xe-data:
    external: true
